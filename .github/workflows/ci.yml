name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm ci
        working-directory: ./example
      - run: npm ci
        working-directory: ./docs

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck
        working-directory: ./example
      - run: npm run typecheck
        working-directory: ./docs

      - name: Check generated documentation
        run: npm run docs:check
        working-directory: ./docs
